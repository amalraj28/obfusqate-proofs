      - {id: 1, kind: theory, name: QuantumCircuit, disposition: wrapper_theory_header}
      - {id: 2, kind: imports, name: Complex_Main, disposition: base_import_and_transitive_wrapper_import}
      - {id: 3, kind: begin, name: null, disposition: wrapper_begin}
      - {id: 321, kind: end, name: null, disposition: wrapper_end}

future_proved_compatibility_wrapper:
  output_file: generated/theories/QuantumCircuit.thy
  theory_name: QuantumCircuit
  imports: [Quantum_Circuit_Examples]
  generation_stage: 5
  purpose: >-
    Synthesized proved compatibility wrapper importing the final generated
    content theory. It does not copy source theory/imports/begin/end commands.
  authoritative_root:
    path: QuantumCircuit.thy
    immutable: true
  source_structural_commands: [1, 2, 3, 321]

import_dag:
  roots: [Complex_Main]
  edges:
    - [Complex_Main, Quantum_Circuit_Model]
    - [Quantum_Circuit_Model, Quantum_Circuit_Graph]
    - [Quantum_Circuit_Graph, Quantum_Circuit_Construction]
    - [Quantum_Circuit_Construction, Quantum_Circuit_Wire_Splice]
    - [Quantum_Circuit_Wire_Splice, Quantum_Circuit_Insert_Core]
    - [Quantum_Circuit_Insert_Core, Quantum_Circuit_Insert_Validity]
    - [Quantum_Circuit_Insert_Validity, Quantum_Circuit_Navigation]
    - [Quantum_Circuit_Navigation, Quantum_Circuit_Delete_Core]
    - [Quantum_Circuit_Delete_Core, Quantum_Circuit_Delete_Validity]
    - [Quantum_Circuit_Delete_Validity, Quantum_Circuit_Operation_Replace]
    - [Quantum_Circuit_Operation_Replace, Quantum_Circuit_Subcircuit_Model]
    - [Quantum_Circuit_Subcircuit_Model, Quantum_Circuit_Subcircuit_Edit]
    - [Quantum_Circuit_Subcircuit_Edit, Quantum_Circuit_Subcircuit_Connect]
    - [Quantum_Circuit_Subcircuit_Connect, Quantum_Circuit_Subcircuit_Replace_Core]
    - [Quantum_Circuit_Subcircuit_Replace_Core, Quantum_Circuit_Subcircuit_Replace_Acyclicity]
    - [Quantum_Circuit_Subcircuit_Replace_Acyclicity, Quantum_Circuit_Examples]
    - [Quantum_Circuit_Examples, QuantumCircuit_Skeleton]
  acyclic: true
  dependency_policy: >-
    The content theories form a source-order chain. This deliberately preserves
    every implicit dependency, theorem attribute, interpretation, and namespace
    effect without attempting speculative dependency minimisation.

inventory_validation:
  method: >-
    Expand every owned_command_intervals pair inclusively. Require each interval
    to be ordered, require the expanded multiset to equal integers 1 through
    321, and compare every recorded endpoint kind/name/authoritative line with
    manifests/source_map.json.
  declared_interval_count: 18
  expanded_assignment_count: 321
  unique_assignment_count: 321
  expected_command_ids: "1..321"
  missing_command_ids: []
  duplicate_command_ids: []
  out_of_range_command_ids: []
  endpoint_mismatches: []
  source_map_validation_status: passed
  partition_inventory_status: passed

stage_4_gate:
  approved: true
  authorized_action: partition_skeleton_only
  immutable_files: [QuantumCircuit.thy, QuantumCircuit_Skeleton.thy]

stage_5_constraints:
  restore_proof_bearing_outer_commands: [lemma, theorem, corollary, proposition, interpretation]
  subcircuit_replacement_validity: >-
    Do not claim full valid-circuit preservation for subcircuit replacement
    unless a corresponding theorem exists in the source inventory.
