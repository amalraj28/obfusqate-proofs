  theorem_assumptions: unchanged
  theorem_attributes: unchanged
  definition_names_and_equations: unchanged
  command_order_within_each_partition: source_order
  proof_placeholders_at_stage_4: sorry
  source_structural_commands: represented_as_metadata
  source_trivia: >-
    Attach blank lines and comments immediately preceding a command to that
    command; preserve trivia inside commands verbatim. Attach final trailing
    trivia to source command 321. No block comments or text commands occur in
    the current skeleton; command 215 is the sole section command.
  generated_headers: >-
    Theory/import/begin/end syntax required for each output file is structural
    synthesis, not a content-command edit. Source structural commands 1-3 and
    321 are represented as metadata only; generated headers and wrappers are
    always synthesized and never copied verbatim.

